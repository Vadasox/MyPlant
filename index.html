
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPlant - Cuidados y Riego</title>
    <link rel="stylesheet" href="estilos.css">

    <style>
        .calendario-seccion {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .day-header {
            text-align: center;
            font-weight: bold;
            color: #666;
            font-size: 0.85rem;
            padding-bottom: 5px;
        }

        .day-cell {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .day-number {
            font-weight: bold;
            font-size: 0.9rem;
            color: #333;
        }

        .badge {
            font-size: 0.65rem;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: 600;
        }

        .day-cell.riego {
            background-color: #c8e6c9;
            border-color: #4caf50;
        }

        .day-cell.riego .badge {
            background-color: #2e7d32;
            color: white;
        }

        .alerta-riego-hoy {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            font-weight: bold;
        }

        .planta-registrada {
            background: #fdfdfd;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 6px;
        }

        .planta-hoy {
            border: 2px solid #4caf50;
            background-color: #e8f5e9;
        }

        .btn-eliminar {
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .mensaje-vacio {
            color: #777;
        }
    </style>
</head>

<body>

    <!-- MENÚ DE NAVEGACIÓN -->

    <nav class="menu">
        <div class="logo">🌱 MyPlant</div>

        <ul class="enlaces">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="#mis-plantas">Mis Plantas</a></li>
            <li><a href="calificanos.html" target="_blank">Califícanos</a></li>
            <li><a href="login.html">Iniciar Sesión</a></li>
        </ul>
    </nav>


    <!-- FORMULARIO Y RESULTADOS -->

    <div class="contenedor-principal">

        <section class="panel-formulario">

            <h2>Registra tu Planta</h2>

            <p>
                Ingresa los datos para conocer sus necesidades
                de agua y programar tu riego.
            </p>

            <form id="formularioPlanta">

                <label for="nombre">Nombre de la planta:</label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej. Tomate, Rábano..."
                    required
                >

                <label for="etapa">Etapa de crecimiento:</label>

                <select id="etapa" required>
                    <option value="" disabled selected>
                        Selecciona una opción
                    </option>

                    <option value="semilla">
                        Semilla / Germinación
                    </option>

                    <option value="brote">
                        Brote en maceta
                    </option>

                    <option value="crecimiento">
                        Crecimiento vegetativo
                    </option>

                    <option value="madura">
                        Planta Madura / Cosecha
                    </option>
                </select>


                <label for="clima">Estado del clima:</label>

                <select id="clima" required>

                    <option value="" disabled selected>
                        Selecciona un clima
                    </option>

                    <option value="seco">Seco</option>
                    <option value="templado">Templado</option>
                    <option value="humedo">Húmedo</option>
                    <option value="arido">Árido</option>

                </select>


                <label for="fecha_riego">
                    Fecha del próximo riego:
                </label>

                <input
                    type="date"
                    id="fecha_riego"
                    required
                >

                <button
                    type="submit"
                    class="btn-consultar"
                >
                    Guardar y Consultar
                </button>

            </form>

        </section>


        <!-- RESULTADOS -->

        <section class="panel-resultados">

            <h2>Resultados de Cuidados</h2>

            <div class="caja-informacion" id="resultado">

                <p class="mensaje-vacio">
                    Completa el formulario para ver la información aquí.
                </p>

            </div>

        </section>

    </div>


    <!-- MIS PLANTAS REGISTRADAS -->

    <div
        style="width: 80%; margin: 20px auto;"
        id="mis-plantas"
    >

        <section style="
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        ">

            <h2>
                🌿 Mis Plantas Registradas y Recordatorios
            </h2>

            <div id="contenedorAlertas"></div>

            <ul
                id="listaPlantas"
                style="list-style: none; padding: 0;"
            ></ul>

        </section>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        // ALMACENAMIENTO DE PLANTAS

        let misPlantas = JSON.parse(
            localStorage.getItem("misPlantas")
        ) || [];


        // GUARDAR PLANTAS

        function guardarPlantas() {

            localStorage.setItem(
                "misPlantas",
                JSON.stringify(misPlantas)
            );

        }


        // EVITAR INSERTAR TEXTO HTML NO DESEADO

        function escaparHTML(texto) {

            return String(texto).replace(/[&<>"']/g, function(caracter) {

                const equivalencias = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };

                return equivalencias[caracter];

            });

        }


        // CONVERTIR TEXTO A MAYÚSCULAS INICIALES

        function primeraMayuscula(texto) {

            return texto.charAt(0).toUpperCase() + texto.slice(1);

        }


        // REGISTRAR PLANTA

        document.getElementById("formularioPlanta")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();

            const etapa = document.getElementById("etapa").value;

            const clima = document.getElementById("clima").value;

            const fechaRiego = document.getElementById("fecha_riego").value;


            if (!nombre || !etapa || !clima || !fechaRiego) {

                alert("Por favor, completa todos los campos.");

                return;

            }


            // CREAR NUEVA PLANTA

            const nuevaPlanta = {

                id: Date.now(),

                nombre: nombre,

                etapa: etapa,

                clima: clima,

                fecha_riego: fechaRiego

            };


            // GUARDAR EN LA LISTA

            misPlantas.push(nuevaPlanta);

            guardarPlantas();


            // MOSTRAR RESULTADOS

            mostrarResultado(nuevaPlanta);


            // ACTUALIZAR LISTA DE PLANTAS

            mostrarPlantas();


            // LIMPIAR FORMULARIO

            this.reset();

        });



        // MOSTRAR INFORMACIÓN DE CUIDADOS

        function mostrarResultado(planta) {

            let necesidadAgua = "";

            if (planta.etapa === "semilla") {

                necesidadAgua =
                "Mantener el sustrato húmedo constantemente con un atomizador. Evitar encharcamientos.";

            } else {

                necesidadAgua =
                "Riego moderado. Revisar la humedad de la tierra antes de regar.";

            }


            document.getElementById("resultado").innerHTML = `

                <h3>
                    Información para:
                    <strong>${escaparHTML(planta.nombre)}</strong>
                </h3>

                <p>
                    <strong>Etapa:</strong>
                    ${escaparHTML(primeraMayuscula(planta.etapa))}
                </p>

                <p>
                    <strong>Clima seleccionado:</strong>
                    ${escaparHTML(primeraMayuscula(planta.clima))}
                </p>

                <p>
                    <strong>Próximo riego programado:</strong>
                    ${escaparHTML(planta.fecha_riego)}
                </p>

                <hr>

                <h4>💧 Necesidad de Agua:</h4>

                <p>${necesidadAgua}</p>

            `;

        }



        // OBTENER FECHA ACTUAL

        function obtenerFechaActual() {

            const hoy = new Date();

            const anio = hoy.getFullYear();

            const mes = String(hoy.getMonth() + 1).padStart(2, '0');

            const dia = String(hoy.getDate()).padStart(2, '0');

            return `${anio}-${mes}-${dia}`;

        }



        // MOSTRAR PLANTAS REGISTRADAS

        function mostrarPlantas() {

            const lista = document.getElementById("listaPlantas");

            const contenedorAlertas =
                document.getElementById("contenedorAlertas");

            lista.innerHTML = "";

            contenedorAlertas.innerHTML = "";


            const fechaActualComputadora = obtenerFechaActual();

            let plantasARegarHoy = [];


            if (misPlantas.length === 0) {

                lista.innerHTML = `
                    <p>Aún no has registrado ninguna planta.</p>
                `;

                return;

            }


            misPlantas.forEach(function(planta) {

                const li = document.createElement("li");

                li.className = "planta-registrada";


                // COMPROBAR SI TOCA REGAR HOY

                if (planta.fecha_riego === fechaActualComputadora) {

                    plantasARegarHoy.push(planta.nombre);

                    li.classList.add("planta-hoy");

                }


                li.innerHTML = `

                    <strong>${escaparHTML(planta.nombre)}</strong>

                    <br>

                    Etapa:
                    ${escaparHTML(primeraMayuscula(planta.etapa))}

                    <br>

                    Clima:
                    ${escaparHTML(primeraMayuscula(planta.clima))}

                    <br>

                    💧 Próximo riego programado:

                    <strong>
                        ${escaparHTML(planta.fecha_riego)}
                    </strong>

                    <br>

                    <button
                        type="button"
                        class="btn-eliminar"
                        data-id="${planta.id}"
                    >
                        Eliminar planta
                    </button>

                `;


                lista.appendChild(li);

            });


            // MOSTRAR RECORDATORIO DE RIEGO

            if (plantasARegarHoy.length > 0) {

                const alerta = document.createElement("div");

                alerta.className = "alerta-riego-hoy";

                alerta.textContent =
                    `🔔 ¡Recordatorio de Riego! Hoy (${fechaActualComputadora}) debes regar las siguientes plantas: ${plantasARegarHoy.join(", ")}.`;

                contenedorAlertas.appendChild(alerta);

            }

        }



        // ELIMINAR PLANTAS

        document.getElementById("listaPlantas")
        .addEventListener("click", function(event) {

            if (event.target.classList.contains("btn-eliminar")) {

                const id = Number(event.target.dataset.id);

                if (confirm("¿Estás seguro de eliminar esta planta?")) {

                    misPlantas = misPlantas.filter(function(planta) {

                        return planta.id !== id;

                    });

                    guardarPlantas();

                    mostrarPlantas();

                }

            }

        });



        // MOSTRAR PLANTAS AL ABRIR LA PÁGINA

        mostrarPlantas();


    </script>

</body>
</html>
